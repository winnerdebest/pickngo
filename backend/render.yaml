databases:
  - name: pickngo-postgres
    databaseName: pickngo_db
    user: pickngo_user
    plan: starter # or free tier if available
    region: frankfurt # Low latency for Nigeria

services:
  - type: web
    name: pickngo-api
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pickngo-postgres
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
